[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "or-autoresearch"
version = "0.1.0"
description = "General MIP autoresearch loop: autonomous LLM research improving solvers on optimization benchmarks (MDKP first)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "highspy>=1.8",
]

[project.scripts]
or-loop = "scripts.run_loop:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["autoresearch", "evaluation", "scripts", "problems"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
